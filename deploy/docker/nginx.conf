# StockWhisk — nginx inside docker-compose. Proxies to the `web` service and
# serves the shared static/media volumes. For TLS, terminate at an upstream
# load balancer, or add a certbot companion + 443 server block.

upstream stockwhisk_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://stockwhisk_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
