{% extends "web/base.html" %}
{% block title %}Edit product{% endblock %}
{% block heading %}Edit product{% endblock %}
{% block content %}
<div class="card shadow-sm" style="max-width:40rem"
     x-data="{ parent:'{{ sel_parent|default_if_none:"" }}', sub:'{{ sel_sub|default_if_none:"" }}',
               subs:[{% for s in subcategories %}{id:{{ s.id }},name:&quot;{{ s.name|escapejs }}&quot;,parent_id:{{ s.parent_id }}}{% if not forloop.last %},{% endif %}{% endfor %}] }"><div class="card-body">
  <form method="post" class="row g-3">
    {% csrf_token %}
    <div class="col-12"><label class="small w-100">Name<input name="name" value="{{ product.name }}" required class="form-control mt-1"></label></div>
    <div class="col-md-6"><label class="small w-100">SKU<input name="sku" value="{{ product.sku }}" class="form-control mt-1"></label></div>
    <div class="col-md-6"><label class="small w-100">Barcode<input name="barcode" value="{{ product.barcode }}" class="form-control mt-1"></label></div>

    <div class="col-md-6"><label class="small w-100">Category
      <select name="category" x-model="parent" @change="sub=''" class="form-select mt-1">
        <option value="">— none —</option>
        {% for c in parent_categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
      </select></label></div>
    <div class="col-md-6"><label class="small w-100">Subcategory
      <select name="subcategory" x-model="sub" class="form-select mt-1">
        <option value="">— none —</option>
        <template x-for="s in subs.filter(x => String(x.parent_id) === String(parent))" :key="s.id">
          <option :value="s.id" x-text="s.name"></option>
        </template>
      </select></label></div>

    <div class="col-md-6"><label class="small w-100">Brand
      <select name="brand" class="form-select mt-1">
        <option value="">— none —</option>
        {% for b in brands %}<option value="{{ b.id }}" {% if product.brand_id == b.id %}selected{% endif %}>{{ b.name }}</option>{% endfor %}
      </select></label></div>
    <div class="col-md-6"><label class="small w-100">Warranty (months)<input name="warranty_months" type="number" min="0" value="{{ product.warranty_months }}" class="form-control mt-1"></label></div>

    <div class="col-md-6"><label class="small w-100">Cost<input name="cost_price" type="number" step="0.01" min="0" value="{{ product.cost_price }}" class="form-control mt-1"></label></div>
    <div class="col-md-6"><label class="small w-100">Price<input name="selling_price" type="number" step="0.01" min="0" value="{{ product.selling_price }}" class="form-control mt-1"></label></div>
    <div class="col-md-6"><label class="small w-100">Reorder level<input name="reorder_level" type="number" step="0.01" min="0" value="{{ product.reorder_level }}" class="form-control mt-1"></label></div>
    <div class="col-md-6 d-flex align-items-center"><label class="form-check-label small"><input type="checkbox" name="is_active" class="form-check-input me-1" {% if product.is_active %}checked{% endif %}> Active</label></div>
    <div class="col-12 d-flex gap-2">
      <button class="btn btn-brand btn-sm">Save</button>
      <a href="{% url 'web:products' %}" class="btn btn-light btn-sm">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock %}
