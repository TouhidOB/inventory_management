# StockWhisk — nginx site config
# Place at /etc/nginx/sites-available/stockwhisk and symlink into sites-enabled.
# TLS blocks assume certbot; run:  certbot --nginx -d app.example.com

upstream stockwhisk_app {
    server unix:/run/stockwhisk/gunicorn.sock fail_timeout=0;
}

# --- HTTP → HTTPS redirect ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # Let certbot answer ACME challenges before redirecting.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS -------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    # certbot fills these in:
    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 12M;          # matches the app's upload caps
    keepalive_timeout 65;

    # gzip text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Static files (collectstatic output) ---
    location /static/ {
        alias /srv/stockwhisk/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # --- Media (user uploads: logos, imports) ---
    location /media/ {
        alias /srv/stockwhisk/media/;
        expires 7d;
        access_log off;
    }

    # --- Application ---
    location / {
        proxy_pass http://stockwhisk_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
